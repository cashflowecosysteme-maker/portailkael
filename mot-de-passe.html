<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changer mon mot de passe · Portail Kael</title><link rel="stylesheet" href="/css/login.css">
<style>
.pw-page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}.pw-card{width:min(100%,460px);background:rgba(26,37,84,.55);border:1px solid rgba(123,92,255,.2);border-radius:24px;padding:34px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.4)}
.pw-card h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 8px;color:#e9e7ff}.pw-card p{color:#aab1d0;font-size:13px;line-height:1.55}.pw-form{display:grid;gap:15px;margin-top:22px}.pw-form label{font-size:12px;font-weight:600;color:#aab1d0;text-transform:uppercase;letter-spacing:.6px}
.pw-form input{width:100%;background:rgba(15,28,63,.72);border:1px solid rgba(123,92,255,.22);border-radius:12px;color:#eef0ff;font:inherit;padding:13px 15px;outline:none}.pw-form input:focus{border-color:rgba(123,92,255,.6);box-shadow:0 0 0 3px rgba(123,92,255,.1)}
.pw-btn{border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,#7B5CFF,#6d4aff);color:white;font-weight:700;cursor:pointer}.pw-btn:disabled{opacity:.6}.pw-msg{display:none;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}.pw-msg.ok{display:block;background:rgba(0,230,118,.09);border:1px solid rgba(0,230,118,.25);color:#9ff0c7}.pw-msg.err{display:block;background:rgba(255,75,110,.09);border:1px solid rgba(255,75,110,.25);color:#ff9eb3}
.pw-links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px}.pw-links a{color:#a78bfa;text-decoration:none}.pw-links a:hover{text-decoration:underline}
</style>
</head><body><canvas id="starry-canvas"></canvas><main class="pw-page"><section class="pw-card"><h1>Changer mon mot de passe</h1><p>Entre ton mot de passe actuel, puis ton nouveau mot de passe. Après le changement, tu devras te reconnecter.</p><form class="pw-form" id="change-form"><div><label for="current-password">Mot de passe actuel</label><input id="current-password" type="password" autocomplete="current-password" required></div><div><label for="change-password">Nouveau mot de passe</label><input id="change-password" type="password" autocomplete="new-password" minlength="8" required></div><div><label for="change-confirm">Confirmer</label><input id="change-confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="pw-btn" id="change-btn" type="submit">Changer mon mot de passe</button><div class="pw-msg" id="change-msg"></div></form><div class="pw-links"><a href="/dashbord">← Retour au portail</a></div></section></main><script src="/js/starry-bg.js" defer></script><script src="/js/password.js"></script></body></html>
